worker_processes 1;

events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile        on;
    keepalive_timeout 65;

    # 10010端口服务
    server {
        listen 10010;
        server_name localhost;
        
        location / {
            default_type text/plain;
            return 200 "Port: 10010, Time: $time_local\n";
        }
    }

    # 10020端口服务
    server {
        listen 10020;
        server_name localhost;
        
        location / {
            default_type text/plain;
            return 200 "Port: 10020, Time: $time_local\n";
        }
    }

    # 10030端口服务
    server {
        listen 10030;
        server_name localhost;
        
        location / {
            default_type application/json;
            return 200 '{"code":0,"result":0,"message":"success","data":{"accountId":"$request_id"}}';
        }
    }
}

